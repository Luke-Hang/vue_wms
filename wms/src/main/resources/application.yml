spring:
  datasource:
    url: jdbc:mysql://localhost:3330/wms?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: mysql@2026
    driver-class-name: com.mysql.cj.jdbc.Driver

  #  添加swagger时，对于Spring Boot 2.6+版本，可能需要添加以下配置，解决启动时的路径匹配问题：
  mvc:
    pathmatch:
      matching-strategy: ant-path-matcher

logging:
  level:
    com.wms: debug
    org.apache.ibatis: DEBUG
    java.sql: DEBUG

server:
  port: 8091

pagehelper:
  helper-dialect: mysql   # 数据库方言
  reasonable: true        # 分页合理化
  support-methods-arguments: true
  params: count=countSql

